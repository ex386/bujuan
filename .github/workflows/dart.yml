name: Flutter CI

on:
  push:
    branches: [ "feature/new-ui" ]
  pull_request:
    branches: [ "feature/new-ui" ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      # 关键修复：显式指定分支和token
      - uses: actions/checkout@v4
        with:
          ref: feature/new-ui
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '11'
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'
      
      - name: Install dependencies
        run: flutter pub get
      
      - name: Analyze project source
        run: flutter analyze
      
      - name: Run tests
        run: flutter test
      
      - name: Build APK
        run: flutter build apk --release
      
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
