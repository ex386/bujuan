name: Flutter CI - Build on Push

on:
  push:
    branches: [main, master, dev]

jobs:
  build-android:
    runs-on: ubuntu-latest
    
    permissions:  # ⭐ 关键：设置工作流权限
      contents: write    # 允许写入内容（推送、创建标签等）
      packages: read     # 允许读取包
      actions: read      # 允许读取Actions信息
    
    steps:
      # 第一步：正确检出代码（解决权限问题）
      - name: 📥 检出代码（带完整权限）
        uses: actions/checkout@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}  # 使用 GitHub 提供的 token
          fetch-depth: 0                      # 获取完整历史
          lfs: false                          # 按需开启 Git LFS
          
      # 可选：检查检出结果
      - name: 🔍 验证代码检出
        run: |
          echo "当前目录内容："
          ls -la
          echo "Git 仓库状态："
          git status
          echo "远程仓库："
          git remote -v
          
      # 后续步骤保持不变...
      - name: ☕ 设置 Java 环境
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'
          
      - name: 🐦 设置 Flutter 环境
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 'stable'
          cache: true
          
      - name: 📦 获取依赖
        run: flutter pub get
        
      - name: 🏗️ 构建 Android APK
        run: flutter build apk --release
        
      - name: 💾 上传构建产物
        uses: actions/upload-artifact@v3
        with:
          name: flutter-apk
          path: build/app/outputs/flutter-apk/*.apk 