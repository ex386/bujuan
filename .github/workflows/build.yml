name: Flutter Build Pipeline

permissions:
  contents: write  # 允许写入仓库内容（如提交、创建标签）
  packages: read   # 允许读取包
  actions: read    # 允许读取其他Actions信息
  checks: write    # 如果需要向提交状态报告，可添加此项
 
on:
  push:
    branches: [main, dev, 'release/*']
  pull_request:
    branches: [main]
  workflow_dispatch:  # 重要：添加手动触发

jobs:
  validate:
    name: "验证与构建"
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 检出代码
        uses: actions/checkout@v3
        with:
          fetch-depth: 1
          
      - name: 🐦 安装 Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'  # 指定稳定版本
          channel: 'stable'
          
      - name: 📊 环境信息
        run: |
          flutter --version
          echo "Dart SDK 版本: $(dart --version)"
          
      - name: 📦 获取依赖
        run: flutter pub get
        
      - name: 🔍 代码分析
        run: flutter analyze
        
      - name: 🧪 运行测试
        run: flutter test
        
      - name: 🏗️ 构建 Android APK
        run: |
          flutter build apk --release --no-tree-shake-icons
          echo "✅ APK 构建完成"
          ls -lh build/app/outputs/flutter-apk/
          
      - name: 📁 上传产物
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: build/app/outputs/flutter-apk/*.apk
          
      - name: 📋 生成报告
        if: always()
        run: |
          echo "## 构建报告" >> $GITHUB_STEP_SUMMARY
          echo "- **状态**: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
          echo "- **触发方式**: ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **分支**: ${{ github.ref }}" >> $GITHUB_STEP_SUMMARY
          echo "✅ 查看详细日志请点击上方步骤" >> $GITHUB_STEP_SUMMARY 